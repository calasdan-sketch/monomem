# monomem — one-command self-host.
#   1. copy .env.example to .env and set a strong MONOMEM_TOKEN
#   2. docker compose up -d
#   3. dashboard at http://localhost:8790  (sign in with your token)
#
# The bridge binds 0.0.0.0 INSIDE the container (needed for Docker networking),
# but you should only expose it to the internet behind an authenticated tunnel
# (Cloudflare Tunnel + Access, Tailscale, or a reverse proxy with auth).
# Your notes never leave this machine — the tunnel is only a pipe.

services:
  monomem:
    build: .
    ports:
      - "127.0.0.1:8790:8790" # HTTP API + dashboard (host loopback only)
      - "127.0.0.1:8791:8791" # MCP over HTTP (point your tunnel here)
    environment:
      MONOMEM_BIND: "0.0.0.0"
      MONOMEM_TOKEN: "${MONOMEM_TOKEN:?set MONOMEM_TOKEN in a .env file}"
      MONOMEM_HOME: "/data"
      MONOMEM_DB_PATH: "/data/state.db"
    volumes:
      - monomem-data:/data
    restart: unless-stopped
    # Hardening: nothing is written except the /data volume (and a small temp folder in memory); no extra Linux
    # privileges; a memory ceiling so one runaway request cannot take the machine down.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    pids_limit: 256
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8790/ready >/dev/null && wget -qO- http://127.0.0.1:8791/health >/dev/null"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 60s

volumes:
  monomem-data:
