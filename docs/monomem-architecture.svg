<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="670" viewBox="0 0 1200 670" role="img" aria-labelledby="t d">
<title id="t">How Monomem works</title>
<desc id="d">Your AI agents (Claude Code, Codex, Cursor, Copilot, Gemini CLI, Zed) save through MCP or REST. A write check refuses secrets, and writes that match a known attack pattern are held for your review; only your approval stores them. Everything else goes into one SQLite file where each note keeps its writer, its history and its privacy label. Reads show pinned notes first at session start, hide private notes from limited apps, leave out distrusted writers, and show new notes' titles on your next message, so every agent's next session recalls what the others saved.</desc>
<style>
  svg{--bg:#F1F6F9;--panel:#FFFFFF;--ink:#12212C;--muted:#4A5D6B;--rule:#D9E3EA;--navy:#0B2E45;--ocean:#155F87;--gold:#F0C171;--goldt:#8A5A12;--held:#A23B2E;--heldbg:#FBEDEA;--dbbg:#E6F0F6;--onnavy:#FFFFFF}
  @media (prefers-color-scheme: dark){svg{--bg:#0B1A26;--panel:#102434;--ink:#EEF4F8;--muted:#A9BCCA;--rule:#2A4559;--navy:#0B2E45;--ocean:#4FA3D1;--goldt:#F0C171;--held:#E58A7E;--heldbg:#2E1C1E;--dbbg:#13304A}}
  .serif{font-family:'Libre Baskerville',Georgia,'Times New Roman',serif}
  text{font-family:'IBM Plex Sans','Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif;fill:var(--ink);font-size:14px}
  .h1{font-size:26px;font-weight:700}.sub{fill:var(--muted);font-size:14.5px}
  .h{font-size:17px;font-weight:700}.m{fill:var(--muted);font-size:13px}.s{font-size:13.5px}
  .lbl{font-size:12.5px;fill:var(--muted)}.gl{fill:var(--goldt);font-weight:700;font-size:13px}
  .w{fill:var(--onnavy)}.wm{fill:#C9DCE8;font-size:13.5px}.hr{fill:var(--held);font-weight:700}
  .box{fill:var(--panel);stroke:var(--rule);stroke-width:1.5}
  .edge{fill:none;stroke:var(--muted);stroke-width:2}.dash{stroke-dasharray:4 5}
  .dot{stroke:var(--bg);stroke-width:2.5}.ok{fill:var(--ocean)}.bad{fill:var(--held)}.sec{fill:var(--goldt)}
  .cap{font-size:14px;font-weight:600}
  .still{display:none}
  @media (prefers-reduced-motion: reduce){.anim{display:none}.still{display:inline}}
</style>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
</defs>
<rect width="1200" height="670" fill="var(--bg)"/>
<text x="40" y="52" class="serif h1" text-anchor="start">How Monomem works</text>
<text x="40" y="76" class="sub" text-anchor="start">One small Node process on your machine. Every note keeps who wrote it.</text>

<!-- Monomem frame -->
<rect x="250" y="130" width="925" height="400" rx="18" fill="none" stroke="var(--rule)" stroke-width="1.5" stroke-dasharray="6 6"/>
<text x="270" y="516" class="lbl" text-anchor="start">MONOMEM · ONE SQLITE FILE, NO CLOUD</text>

<!-- edges -->
<path class="edge" d="M220,290 H273" marker-end="url(#a)"/><text x="246" y="280" class="lbl" text-anchor="middle">save</text>
<path class="edge" d="M390,290 H428" marker-end="url(#a)"/>
<path class="edge" d="M620,290 H663" marker-end="url(#a)"/><text x="642" y="280" class="lbl" text-anchor="middle">clean</text>
<path class="edge" d="M525,230 V196" marker-end="url(#a)"/>
<path class="edge" d="M525,350 V398" marker-end="url(#a)"/><text x="535" y="381" class="lbl" text-anchor="start">matches a known attack pattern</text>
<path class="edge" d="M620,445 H755 V359" marker-end="url(#a)"/><text x="686" y="437" class="gl" text-anchor="middle">you approve</text>
<path class="edge" d="M845,290 H903" marker-end="url(#a)"/>
<path class="edge" d="M1030,175 V108 H125 V173" marker-end="url(#a)"/>
<path class="edge dash" d="M525,490 V573"/>



<!-- agents -->
<rect x="30" y="175" width="190" height="230" rx="14" fill="var(--navy)"/>
<text x="50" y="207" class="serif h w" text-anchor="start">Your AI agents</text>
<text x="50" y="238" class="wm" text-anchor="start">Claude Code</text>
<text x="50" y="264" class="wm" text-anchor="start">Codex</text>
<text x="50" y="290" class="wm" text-anchor="start">Cursor</text>
<text x="50" y="316" class="wm" text-anchor="start">Copilot</text>
<text x="50" y="342" class="wm" text-anchor="start">Gemini CLI</text>
<text x="50" y="368" class="wm" text-anchor="start">Zed and others</text>

<!-- MCP / REST -->
<rect class="box" x="275" y="265" width="115" height="50" rx="25"/>
<text x="332" y="295" class="s" text-anchor="middle">MCP · REST</text>

<!-- write check -->
<rect x="430" y="230" width="190" height="120" rx="12" fill="var(--panel)" stroke="var(--gold)" stroke-width="3"/>
<text x="525" y="262" class="serif h" text-anchor="middle">Write check</text>
<text x="525" y="290" class="s" text-anchor="middle">secrets: refused</text>
<text x="525" y="312" class="s" text-anchor="middle">known attack patterns:</text>
<text x="525" y="330" class="s" text-anchor="middle">held for your review</text>

<!-- refused -->
<rect x="440" y="158" width="170" height="36" rx="18" fill="var(--heldbg)" stroke="var(--held)" stroke-width="1.5"/>
<text x="525" y="181" class="s hr" text-anchor="middle">Refused, not stored</text>
<rect class="anim" x="436" y="154" width="178" height="44" rx="22" fill="none" stroke="var(--held)" stroke-width="3" opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.4417;0.525" values="0;1;0"/></rect>

<!-- held -->
<rect x="430" y="400" width="190" height="90" rx="12" fill="var(--heldbg)" stroke="var(--held)" stroke-width="2"/>
<text x="525" y="430" class="serif h" text-anchor="middle">Held</text>
<text x="525" y="452" class="m" text-anchor="middle">not readable by agents</text>
<text x="525" y="472" class="m" text-anchor="middle">waits for your OK</text>
<rect class="anim" x="425" y="395" width="200" height="100" rx="15" fill="none" stroke="var(--held)" stroke-width="3" opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.6333;0.8333" values="0;1;0"/><animate attributeName="stroke-opacity" dur="1.2s" repeatCount="indefinite" values="1;0.25;1"/></rect>
<rect class="anim" x="640" y="422" width="92" height="22" rx="11" fill="var(--gold)" opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.7833;0.8833" values="0;1;0"/></rect>
<text class="anim" x="686" y="437" text-anchor="middle" style="font-size:13px;font-weight:700;fill:#12212C" opacity="0">you approve<animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.7833;0.8833" values="0;1;0"/></text>

<!-- SQLite -->
<path d="M665,235 V345 A90,14 0 0 0 845,345 V235" fill="var(--dbbg)" stroke="var(--ocean)" stroke-width="2"/>
<ellipse cx="755" cy="235" rx="90" ry="14" fill="var(--dbbg)" stroke="var(--ocean)" stroke-width="2"/>
<text x="755" y="278" class="serif h" text-anchor="middle">One SQLite file</text>
<text x="755" y="302" class="m" text-anchor="middle">each note keeps its</text>
<text x="755" y="320" class="s" text-anchor="middle">writer · history</text>
<text x="755" y="338" class="s" text-anchor="middle">privacy label</text>

<!-- reads -->
<rect class="box" x="905" y="175" width="250" height="230" rx="14"/>
<text x="925" y="205" class="serif h" text-anchor="start">Reads</text>
<circle cx="931" cy="229" r="3.5" fill="var(--ocean)"/><text x="943" y="234" class="s" text-anchor="start">Pinned notes first</text><text x="943" y="252" class="m" text-anchor="start">at session start</text>
<circle cx="931" cy="273" r="3.5" fill="var(--ocean)"/><text x="943" y="278" class="s" text-anchor="start">Private notes hidden</text><text x="943" y="296" class="m" text-anchor="start">from limited apps</text>
<circle cx="931" cy="317" r="3.5" fill="var(--ocean)"/><text x="943" y="322" class="s" text-anchor="start">Distrusted writers</text><text x="943" y="340" class="m" text-anchor="start">left out</text>
<circle cx="931" cy="361" r="3.5" fill="var(--ocean)"/><text x="943" y="366" class="s" text-anchor="start">New notes' titles</text><text x="943" y="384" class="m" text-anchor="start">on your next message</text>

<!-- you -->
<rect x="400" y="575" width="250" height="66" rx="14" fill="var(--panel)" stroke="var(--gold)" stroke-width="2"/>
<text x="525" y="602" class="serif h" text-anchor="middle">You: dashboard and CLI</text>
<text x="525" y="625" class="m" text-anchor="middle">approve · reject · distrust · roll back</text>
<rect class="anim" x="395" y="570" width="260" height="76" rx="17" fill="none" stroke="var(--gold)" stroke-width="3" opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.7833;0.8833" values="0;1;0"/></rect>

<!-- moving dots (on top; they jump across boxes) -->
<g class="anim">
  <circle r="7" class="dot ok" opacity="0">
    <animateMotion dur="12s" repeatCount="indefinite" path="M220,290 H273 M390,290 H428 M620,290 H663 M845,290 H905 M1030,175 V108 H125 V175" calcMode="linear"
      keyTimes="0;0.35;1" keyPoints="0;1;1"/>
    <animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete"
      keyTimes="0;0.0008;0.35" values="0;1;0"/>
  </circle>
  <circle r="7" class="dot sec" opacity="0">
    <animateMotion dur="12s" repeatCount="indefinite" path="M220,290 H273 M390,290 H428 M525,230 V196" calcMode="linear"
      keyTimes="0;0.3583;0.4417;1" keyPoints="0;0;1;1"/>
    <animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete"
      keyTimes="0;0.3583;0.4458" values="0;1;0"/>
  </circle>
  <circle r="7" class="dot bad" opacity="0">
    <animateMotion dur="12s" repeatCount="indefinite" path="M220,290 H273 M390,290 H428 M525,350 V398 M620,445 H755 V357" calcMode="linear"
      keyTimes="0;0.5333;0.6333;0.8333;0.9167;1" keyPoints="0;0;0.3826;0.3826;1;1"/>
    <animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete"
      keyTimes="0;0.5333;0.9167" values="0;1;0"/>
  </circle>
</g>

<!-- recall label on the return path -->
<rect x="420" y="96" width="420" height="24" rx="12" fill="var(--bg)"/>
<text x="630" y="113" class="lbl" text-anchor="middle">recall: every agent's next session knows what the others saved</text>

<!-- captions: one per loop step; a static legend replaces them under reduced motion -->
<g class="anim">
  <text x="690" y="600" class="cap" opacity="0"><tspan fill="var(--ocean)">●</tspan> A clean note is saved, then recalled by every agent<animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0;0.3583" values="0;1;0"/></text>
  <text x="690" y="600" class="cap" opacity="0"><tspan fill="var(--goldt)">●</tspan> A write containing a secret is refused<animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.3583;0.5333" values="0;1;0"/></text>
  <text x="690" y="600" class="cap" opacity="0"><tspan fill="var(--held)">●</tspan> A known attack pattern waits in Held<animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.5333;0.7833" values="0;1;0"/></text>
  <text x="690" y="600" class="cap" opacity="0"><tspan fill="var(--held)">●</tspan> Stored only after you approve it<animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.7833;1" values="0;1;0"/></text>
</g>
<g class="still"><text x="690" y="600" class="m" text-anchor="start">Clean writes are stored; secrets refused; known attack patterns held until you approve.</text></g>
<text x="690" y="626" class="m" text-anchor="start">The pattern check does not catch everything (see Known limits).</text>
</svg>
