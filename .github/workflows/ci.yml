name: CI

# Pull requests run a smaller matrix (the floor and the current line on Linux, Node 24 on Windows and macOS) so a busy
# build period gets fast answers. The FULL matrix runs on every push to main, nightly, by hand (workflow_dispatch) and
# whenever publish.yml calls this file, so nothing reaches main's history or npm without it.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  # publish.yml calls this instead of keeping its own copy of the matrix.
  # The two had drifted: CI pinned the 22.16.0 floor and the release gate did
  # not, so the one workflow guarding npm was the one that never ran the floor
  # the release was about. One matrix, one source, enforced by reuse rather
  # than by a comment asking the two files to agree.
  workflow_call:

permissions:
  contents: read

# A newer push to the same pull request cancels the older run; pushes to main, nightly and release runs never cancel.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: build & test (Node ${{ matrix.node }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # 22.16.0 is the supported floor (node:sqlite unflagged there), so it is
      # tested, not assumed. Without this the package claimed support for a
      # Node line nothing ever ran on. Full: 3 systems x 4 Node lines. Pull request: the 4 cells below.
      matrix:
        include: ${{ fromJSON(github.event_name == 'pull_request' && '[{"os":"ubuntu-latest","node":"22.16.0"},{"os":"ubuntu-latest","node":"24"},{"os":"windows-latest","node":"24"},{"os":"macos-latest","node":"24"}]' || '[{"os":"ubuntu-latest","node":"22.16.0"},{"os":"ubuntu-latest","node":"22"},{"os":"ubuntu-latest","node":"24"},{"os":"ubuntu-latest","node":"26"},{"os":"windows-latest","node":"22.16.0"},{"os":"windows-latest","node":"22"},{"os":"windows-latest","node":"24"},{"os":"windows-latest","node":"26"},{"os":"macos-latest","node":"22.16.0"},{"os":"macos-latest","node":"22"},{"os":"macos-latest","node":"24"},{"os":"macos-latest","node":"26"}]') }}
    env:
      # Tests only (test/setup-env.ts slow()): wall-clock bounds get 3x room on the Windows and macOS runners, which are
      # the loaded ones (every timing flake so far). Linux keeps the bounds as written.
      MONOMEM_TEST_TIME_SCALE: ${{ matrix.os == 'ubuntu-latest' && '1' || '3' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run build
      - name: no unused locals or imports (src and test)
        run: npx tsc -p tsconfig.json --noEmit --noUnusedLocals
      - run: npm test
      - name: provenance benchmark (exit 1 on a failed scenario)
        run: node dist/src/cli.js bench

  audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: npm ci
      - run: npm audit --audit-level=high

  # 1.5.0 release gate item 12. (a) The whole suite and the benchmark run in a container with no network at all
  # (`--network none`: only loopback), so "Monomem makes no outbound call by default" is run, not only grepped for.
  # (b) The remote guide (docs/two-developers-one-server.md) is run as written: build the image, `docker compose up -d`
  # with MONOMEM_ALLOWED_HOSTS, `token add` for a developer, then /health and an authenticated /notes under that name.
  offline-and-docker-guide:
    name: no network + Docker remote guide
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: npm ci
      - name: npm test + bench + write-cost speed gate with networking disabled
        # node_modules is installed above (the network is needed for that only; the deps are plain JavaScript). Runs as
        # the runner user, not root, so the permission tests mean what they say.
        run: |
          docker run --rm --network none --user "$(id -u):$(id -g)" -e HOME=/tmp -e CI=1 -v "$PWD:/w" -w /w node:24 \
            sh -c 'npm test && node dist/src/cli.js bench && node bench/write-cost.mjs'
      - name: build the image and start it as the remote guide says
        run: |
          sed "s/^MONOMEM_TOKEN=.*/MONOMEM_TOKEN=$(openssl rand -hex 32)/" .env.example > .env
          echo "MONOMEM_ALLOWED_HOSTS=x.ts.net" >> .env
          docker compose up -d --build
          # Fails here (with the container log) when /health never answers, instead of in a later step.
          for _ in $(seq 1 60); do curl -fsS -H 'Host: x.ts.net' http://127.0.0.1:8790/health && exit 0; sleep 2; done
          docker compose logs monomem; echo "::error::/health did not answer within 120 s"; exit 1
      - name: token add (the guide's command; it asks for a typed yes at a terminal, so script(1) gives it one)
        run: |
          echo yes | script -qec "docker compose exec monomem monomem token add alice --max internal" /dev/null | tee token-add.txt
          grep -oE '^[[:space:]]+[0-9a-f]{64}[[:space:]]*$' token-add.txt | tr -d ' \r\t' | head -1 > alice.key
          test -s alice.key
      - name: /health and an authenticated /notes answer 200 under the tunnel name
        run: |
          code() { curl -s -o /dev/null -w '%{http_code}' "$@"; }
          sleep 3 # the running server picks up a new key within a couple of seconds
          h=$(code -H 'Host: x.ts.net' http://127.0.0.1:8790/health)
          n=$(code -H 'Host: x.ts.net' -H "Authorization: Bearer $(cat alice.key)" http://127.0.0.1:8790/notes)
          bad=$(code -H 'Host: other.example' -H "Authorization: Bearer $(cat alice.key)" http://127.0.0.1:8790/notes)
          echo "health=$h notes=$n other-host=$bad"
          test "$h" = 200 && test "$n" = 200 && test "$bad" = 403
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v
