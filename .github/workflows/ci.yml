name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # publish.yml calls this instead of keeping its own copy of the matrix.
  # The two had drifted: CI pinned the 22.16.0 floor and the release gate did
  # not, so the one workflow guarding npm was the one that never ran the floor
  # the release was about. One matrix, one source, enforced by reuse rather
  # than by a comment asking the two files to agree.
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: build & test (Node ${{ matrix.node }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # 22.16.0 is the supported floor (node:sqlite unflagged there), so it is
        # tested, not assumed. Without this the package claimed support for a
        # Node line nothing ever ran on.
        node: ["22.16.0", "22", "24", "26"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: provenance benchmark (exit 1 on a failed scenario)
        run: node dist/src/cli.js bench

  audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - run: npm ci
      - run: npm audit --audit-level=high
